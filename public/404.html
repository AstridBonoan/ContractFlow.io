<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ContractorFlow</title>
    <script>
      (function () {
        var path = location.pathname.replace(/\/ContractFlow\.io(\/ContractFlow\.io)+/gi, "/ContractFlow.io");
        if (path !== location.pathname) {
          location.replace(path + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
